<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAFlash Re:Flexed - Standalone Web Flash Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 2.2rem; color: #38bdf8; font-weight: 800; letter-spacing: -0.5px; }
    h1 span { color: #f97316; }
    p.sub { color: #94a3b8; font-size: 0.95rem; margin-top: 5px; }

    #player-container {
      position: relative;
      width: 850px;
      max-width: 95vw;
      height: 600px;
      max-height: 70vh;
      background: #111827;
      border: 2px dashed #334155;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #player-container.dragover { border-color: #38bdf8; background: #1e293b; transform: scale(1.01); }

    #drop-ui { text-align: center; padding: 30px; cursor: pointer; }
    #drop-ui svg { width: 64px; height: 64px; fill: #38bdf8; margin-bottom: 15px; opacity: 0.9; }
    #drop-ui h3 { font-size: 1.3rem; margin-bottom: 8px; color: #f1f5f9; }
    #drop-ui p { color: #64748b; font-size: 0.9rem; margin-bottom: 18px; }

    .btn-browse {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      border: none;
      transition: background 0.2s;
    }
    .btn-browse:hover { background: #0369a1; }

    #file-input { display: none; }

    #canvas-wrap {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: #000;
    }
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tool-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; color: #fff; border-color: #475569; }
    #status-msg { margin-top: 12px; font-size: 0.9rem; color: #38bdf8; min-height: 22px; font-weight: 500; }
  </style>
</head>
<body>

  <header>
    <h1>WAFlash <span>Re:Flexed</span> ⚡</h1>
    <p class="sub">High-Compatibility WebAssembly Flash Engine (ActionScript 3 & 2)</p>
  </header>

  <div id="player-container">
    <div id="drop-ui">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <h3>Select or Drop a .SWF File</h3>
      <p>Supports heavy AS3 games, Hoshi Saga, and classic animations</p>
      <button class="btn-browse" onclick="document.getElementById('file-input').click()">Browse Files</button>
      <input type="file" id="file-input" accept=".swf">
    </div>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div id="status-msg"></div>

  <div class="controls">
    <button class="tool-btn" onclick="document.getElementById('file-input').click()">📂 Open SWF</button>
    <button class="tool-btn" id="btn-fullscreen">⛶ Fullscreen</button>
    <button class="tool-btn" id="btn-restart" style="display:none;" onclick="location.reload()">🔄 Restart</button>
  </div>

  <script type="module">
    import createWaflash from "./wasm/waflash-player.min.js";

    const box = document.getElementById('player-container');
    const dropUi = document.getElementById('drop-ui');
    const fileInput = document.getElementById('file-input');
    const canvasWrap = document.getElementById('canvas-wrap');
    const statusMsg = document.getElementById('status-msg');
    const btnRestart = document.getElementById('btn-restart');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let blobUrl = null;

    box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
    box.addEventListener('dragleave', () => box.classList.remove('dragover'));
    box.addEventListener('drop', (e) => {
      e.preventDefault();
      box.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.name.toLowerCase().endsWith('.swf')) {
        alert('Please select a valid .swf file!');
        return;
      }
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(file);

      dropUi.style.display = 'none';
      canvasWrap.style.display = 'block';
      box.style.border = 'none';
      btnRestart.style.display = 'inline-block';
      statusMsg.innerText = `Loading "${file.name}"...`;

      try {
        createWaflash(blobUrl);
        statusMsg.innerText = `Running: ${file.name}`;
      } catch (err) {
        console.error(err);
        statusMsg.innerText = 'Failed to initialize WAFlash.';
      }
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        box.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
