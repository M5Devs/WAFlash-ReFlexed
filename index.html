<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAFlash Re:Flexed - Standalone Web Flash Player</title>
  
  <!-- أداة فحص الموبايل عشان تشوف الأخطاء على تليفونك مباشرة -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 1.8rem; color: #38bdf8; font-weight: 800; }
    h1 span { color: #f97316; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

    #player-container {
      position: relative;
      width: 850px;
      max-width: 100%;
      height: 480px;
      max-height: 65vh;
      background: #111827;
      border: 2px dashed #334155;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    #drop-ui { text-align: center; padding: 20px; cursor: pointer; }
    #drop-ui svg { width: 56px; height: 56px; fill: #38bdf8; margin-bottom: 12px; }
    #drop-ui h3 { font-size: 1.15rem; margin-bottom: 6px; color: #f1f5f9; }
    #drop-ui p { color: #64748b; font-size: 0.8rem; margin-bottom: 15px; }

    .btn-browse {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      border: none;
    }

    #file-input { display: none; }

    #canvas-wrap {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: #000;
    }
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .tool-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* الـ ID المطلوب بالمللي للمحاكي */
    #status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>WAFlash <span>Re:Flexed</span> ⚡</h1>
    <p class="sub">High-Compatibility WebAssembly Flash Player</p>
  </header>

  <div id="player-container">
    <div id="drop-ui">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <h3>Tap to Select .SWF File</h3>
      <p>Works with AS3 games & classic animations</p>
      <button class="btn-browse" onclick="document.getElementById('file-input').click()">Browse Files</button>
      <!-- خلينا يقبل كل الملفات عشان أندرويد ميعصلجش -->
      <input type="file" id="file-input" accept=".swf, application/x-shockwave-flash, */*">
    </div>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div id="status"></div>

  <div class="controls">
    <button class="tool-btn" onclick="document.getElementById('file-input').click()">📂 Open SWF</button>
    <button class="tool-btn" id="btn-fullscreen">⛶ Fullscreen</button>
    <button class="tool-btn" id="btn-restart" style="display:none;" onclick="location.reload()">🔄 Restart</button>
  </div>

  <script type="module">
    import * as WaflashModule from "./wasm/waflash-player.min.js";
    const createWaflash = WaflashModule.createWaflash || WaflashModule.default;
    
    const box = document.getElementById('player-container');
    const dropUi = document.getElementById('drop-ui');
    const fileInput = document.getElementById('file-input');
    const canvasWrap = document.getElementById('canvas-wrap');
    const statusMsg = document.getElementById('status');
    const btnRestart = document.getElementById('btn-restart');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let blobUrl = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(file);

      dropUi.style.display = 'none';
      canvasWrap.style.display = 'block';
      box.style.border = 'none';
      btnRestart.style.display = 'inline-block';
      statusMsg.innerText = `Loading "${file.name}"...`;

      try {
        createWaflash(blobUrl);
      } catch (err) {
        console.error(err);
        statusMsg.innerText = 'Error: ' + err.message;
      }
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        box.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
