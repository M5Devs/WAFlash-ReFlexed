<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAFlash Re:Flexed - Standalone Web Flash Player</title>
  
  <!-- Mobile inspection tool -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 1.8rem; color: #38bdf8; font-weight: 800; }
    h1 span { color: #f97316; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

    #player-container {
      position: relative;
      width: 850px;
      max-width: 100%;
      height: 480px;
      max-height: 65vh;
      background: #111827;
      border: 2px dashed #334155;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    #drop-ui {
      position: absolute;
      z-index: 20;
      text-align: center;
      padding: 20px;
      cursor: pointer;
      background: #111827;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #drop-ui svg { width: 56px; height: 56px; fill: #38bdf8; margin-bottom: 12px; }
    #drop-ui h3 { font-size: 1.15rem; margin-bottom: 6px; color: #f1f5f9; }
    #drop-ui p { color: #64748b; font-size: 0.8rem; margin-bottom: 15px; }

    .btn-browse {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      border: none;
    }

    #file-input { display: none; }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: #000;
      z-index: 1;
    }
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .tool-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    #hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      display: none;
      gap: 12px;
    }

    #status, #waflashStatus {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>WAFlash <span>Re:Flexed</span> ⚡</h1>
    <p class="sub">High-Compatibility WebAssembly Flash Player</p>
  </header>

  <div id="player-container">
    <div id="hud-overlay">
      <span>SCORE: <span id="hud-score">0</span></span>
      <span>HP: <span id="hud-hp">0</span></span>
    </div>

    <div id="drop-ui">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <h3>Tap to Select .SWF File</h3>
      <p>Works with AS3 games & classic animations</p>
      <button class="btn-browse" onclick="document.getElementById('file-input').click()">Browse Files</button>
      <input type="file" id="file-input" accept=".swf, application/x-shockwave-flash, */*">
    </div>

    <div id="canvas-wrap">
      <canvas class="waflashCanvas" id="canvas" width="800" height="600" tabindex="0"></canvas>
    </div>
  </div>

  <div id="status"></div>
  <div id="waflashStatus" style="display:none;"></div>
  <div id="spinner" style="display:none;"></div>
  <progress id="progress" style="display:none;" value="0" max="100"></progress>
  <div id="output" style="display:none;"></div>

  <div class="controls">
    <button class="tool-btn" onclick="document.getElementById('file-input').click()">📂 Open SWF</button>
    <button class="tool-btn" id="btn-fullscreen">⛶ Fullscreen</button>
    <button class="tool-btn" id="btn-restart" style="display:none;" onclick="location.reload()">🔄 Restart</button>
  </div>

  <script src="./waflash_core.js"></script>
  <script>
    const box = document.getElementById('player-container');
    const dropUi = document.getElementById('drop-ui');
    const fileInput = document.getElementById('file-input');
    const canvasWrap = document.getElementById('canvas-wrap');
    const canvas = document.getElementById('canvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    const statusMsg = document.getElementById('status');
    const btnRestart = document.getElementById('btn-restart');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const hudOverlay = document.getElementById('hud-overlay');
    const hudScore = document.getElementById('hud-score');
    const hudHp = document.getElementById('hud-hp');

    let wasmModule = null;
    let wasmApi = null;
    let animFrameId = null;

    // Load and initialize WASM Module
    if (typeof createWAFlashCore === 'function') {
      createWAFlashCore().then(Module => {
        wasmModule = Module;
        wasmApi = {
          loadSwf: Module.cwrap('wasm_load_swf', 'number', ['number', 'number']),
          stepFrame: Module.cwrap('wasm_step_frame', null, []),
          getFramebuffer: Module.cwrap('wasm_get_framebuffer', 'number', []),
          getWidth: Module.cwrap('wasm_get_width', 'number', []),
          getHeight: Module.cwrap('wasm_get_height', 'number', []),
          sendKey: Module.cwrap('wasm_send_key', null, ['number', 'number']),
          sendPointer: Module.cwrap('wasm_send_pointer', null, ['number', 'number', 'number']),
          getPlayerScore: Module.cwrap('wasm_get_player_score', 'number', []),
          getPlayerHp: Module.cwrap('wasm_get_player_hp', 'number', [])
        };
        console.log("⚡ WAFlash WASM Core loaded successfully.");
      }).catch(err => {
        console.error("Failed to initialize WAFlash Core WASM Module:", err);
      });
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!wasmApi || !wasmModule) {
        statusMsg.innerText = "WASM Core loading... Please wait a moment and try again.";
        return;
      }

      statusMsg.innerText = `Reading "${file.name}" (${(file.size / 1024).toFixed(1)} KB)...`;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const arrayBuffer = evt.target.result;
        const uint8Array = new Uint8Array(arrayBuffer);

        // Allocate WASM memory and copy file payload
        const ptr = wasmModule._malloc(uint8Array.length);
        wasmModule.HEAPU8.set(uint8Array, ptr);

        const success = wasmApi.loadSwf(ptr, uint8Array.length);
        wasmModule._free(ptr);

        if (!success) {
          statusMsg.innerText = "Error: Failed to parse SWF payload!";
          return;
        }

        const width = wasmApi.getWidth();
        const height = wasmApi.getHeight();
        canvas.width = width;
        canvas.height = height;

        dropUi.style.display = 'none';
        canvasWrap.style.zIndex = '10';
        hudOverlay.style.display = 'flex';
        box.style.border = 'none';
        btnRestart.style.display = 'inline-block';
        statusMsg.innerText = `Loaded "${file.name}" (${width}x${height})`;

        if (canvas) canvas.focus();

        if (animFrameId) cancelAnimationFrame(animFrameId);
        startRenderLoop();
      };

      reader.onerror = function() {
        alert("Failed to read file!");
      };

      reader.readAsArrayBuffer(file);
    }

    function startRenderLoop() {
      function render() {
        if (!wasmApi) return;

        wasmApi.stepFrame();

        const width = canvas.width;
        const height = canvas.height;
        const fbPtr = wasmApi.getFramebuffer();

        if (fbPtr && ctx && width > 0 && height > 0) {
          // Read 32-bit XRGB buffer from WASM HEAPU32
          const pixelCount = width * height;
          const fbData = new Uint32Array(wasmModule.HEAPU32.buffer, fbPtr, pixelCount);
          const imgData = ctx.createImageData(width, height);
          const data32 = new Uint32Array(imgData.data.buffer);

          // Convert XRGB8888 -> RGBA8888
          for (let i = 0; i < pixelCount; ++i) {
            const xrgb = fbData[i];
            const r = (xrgb >> 16) & 0xFF;
            const g = (xrgb >> 8) & 0xFF;
            const b = xrgb & 0xFF;
            data32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          }

          ctx.putImageData(imgData, 0, 0);
        }

        // Update live HUD metrics
        hudScore.innerText = wasmApi.getPlayerScore();
        hudHp.innerText = wasmApi.getPlayerHp();

        animFrameId = requestAnimationFrame(render);
      }

      animFrameId = requestAnimationFrame(render);
    }

    // Input Bindings
    window.addEventListener('keydown', (e) => {
      if (wasmApi) wasmApi.sendKey(e.keyCode, 1);
    });

    window.addEventListener('keyup', (e) => {
      if (wasmApi) wasmApi.sendKey(e.keyCode, 0);
    });

    function getCanvasCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: Math.round((clientX - rect.left) * scaleX),
        y: Math.round((clientY - rect.top) * scaleY)
      };
    }

    if (canvas) {
      ['mousedown', 'touchstart'].forEach(type => {
        canvas.addEventListener(type, (e) => {
          if (!wasmApi) return;
          const coords = getCanvasCoords(e);
          wasmApi.sendPointer(coords.x, coords.y, 1);
        });
      });

      ['mouseup', 'touchend'].forEach(type => {
        canvas.addEventListener(type, (e) => {
          if (!wasmApi) return;
          const coords = getCanvasCoords(e);
          wasmApi.sendPointer(coords.x, coords.y, 0);
        });
      });

      ['mousemove', 'touchmove'].forEach(type => {
        canvas.addEventListener(type, (e) => {
          if (!wasmApi) return;
          const coords = getCanvasCoords(e);
          const isPressed = e.buttons !== 0 || (e.touches && e.touches.length > 0);
          wasmApi.sendPointer(coords.x, coords.y, isPressed ? 1 : 0);
        });
      });
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        box.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
