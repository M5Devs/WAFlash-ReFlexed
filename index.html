<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAFlash Re:Flexed - Standalone Web Flash Player</title>
  
  <!-- أداة فحص الموبايل -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 1.8rem; color: #38bdf8; font-weight: 800; }
    h1 span { color: #f97316; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

    #player-container {
      position: relative;
      width: 850px;
      max-width: 100%;
      height: 480px;
      max-height: 65vh;
      background: #111827;
      border: 2px dashed #334155;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    #drop-ui {
      position: absolute;
      z-index: 20;
      text-align: center;
      padding: 20px;
      cursor: pointer;
      background: #111827;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #drop-ui svg { width: 56px; height: 56px; fill: #38bdf8; margin-bottom: 12px; }
    #drop-ui h3 { font-size: 1.15rem; margin-bottom: 6px; color: #f1f5f9; }
    #drop-ui p { color: #64748b; font-size: 0.8rem; margin-bottom: 15px; }

    .btn-browse {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      border: none;
    }

    #file-input { display: none; }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: #000;
      z-index: 1;
    }
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .tool-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    #status, #waflashStatus {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>WAFlash <span>Re:Flexed</span> ⚡</h1>
    <p class="sub">High-Compatibility WebAssembly Flash Player</p>
  </header>

  <div id="player-container">
    <div id="drop-ui">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <h3>Tap to Select .SWF File</h3>
      <p>Works with AS3 games & classic animations</p>
      <button class="btn-browse" onclick="document.getElementById('file-input').click()">Browse Files</button>
      <input type="file" id="file-input" accept=".swf, application/x-shockwave-flash, */*">
    </div>

    <div id="canvas-wrap">
      <canvas class="waflashCanvas" id="canvas" width="800" height="600" tabindex="0"></canvas>
    </div>
  </div>

  <div id="status"></div>
  <div id="waflashStatus" style="display:none;"></div>
  <div id="spinner" style="display:none;"></div>
  <progress id="progress" style="display:none;" value="0" max="100"></progress>
  <div id="output" style="display:none;"></div>

  <div class="controls">
    <button class="tool-btn" onclick="document.getElementById('file-input').click()">📂 Open SWF</button>
    <button class="tool-btn" id="btn-fullscreen">⛶ Fullscreen</button>
    <button class="tool-btn" id="btn-restart" style="display:none;" onclick="location.reload()">🔄 Restart</button>
  </div>

  <script type="module">
    import * as WaflashModule from "./wasm/waflash-player.min.js";
    const createWaflash = WaflashModule.createWaflash || WaflashModule.default;
    
    const box = document.getElementById('player-container');
    const dropUi = document.getElementById('drop-ui');
    const fileInput = document.getElementById('file-input');
    const canvasWrap = document.getElementById('canvas-wrap');
    const canvas = document.getElementById('canvas');
    const statusMsg = document.getElementById('status');
    const btnRestart = document.getElementById('btn-restart');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let swfArrayBuffer = null;
    const VIRTUAL_SWF_URL = "./waflash-virtual-game.swf";

    // 🚀 السحر البرمجي: اعتراض XHR & Fetch لتسليم الملف للـ C++ فوراً كـ 200 OK
    const origXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
      const xhr = new origXHR();
      let isVirtual = false;
      const origOpen = xhr.open;
      xhr.open = function(method, url) {
        if (url && (url.indexOf("waflash-virtual-game.swf") !== -1)) {
          isVirtual = true;
        }
        return origOpen.apply(this, arguments);
      };
      const origSend = xhr.send;
      xhr.send = function() {
        if (isVirtual && swfArrayBuffer) {
          setTimeout(() => {
            Object.defineProperty(xhr, 'status', { value: 200, writable: false });
            Object.defineProperty(xhr, 'statusText', { value: 'OK', writable: false });
            Object.defineProperty(xhr, 'readyState', { value: 4, writable: false });
            Object.defineProperty(xhr, 'response', { value: swfArrayBuffer, writable: false });
            if (xhr.onload) xhr.onload();
            if (xhr.onreadystatechange) xhr.onreadystatechange();
          }, 10);
          return;
        }
        return origSend.apply(this, arguments);
      };
      return xhr;
    };

    const origFetch = window.fetch;
    window.fetch = function(input, init) {
      const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      if (url && url.indexOf("waflash-virtual-game.swf") !== -1 && swfArrayBuffer) {
        return Promise.resolve(new Response(swfArrayBuffer, {
          status: 200,
          statusText: 'OK',
          headers: { 'Content-Type': 'application/x-shockwave-flash' }
        }));
      }
      return origFetch.apply(this, arguments);
    };

    function unlockAudioContext() {
      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      if (AudioCtxClass) {
        if (window.AL && window.AL.currentCtx && window.AL.currentCtx.audioCtx) {
          if (window.AL.currentCtx.audioCtx.state === 'suspended') {
            window.AL.currentCtx.audioCtx.resume();
          }
        }
      }
    }

    ['touchstart', 'touchend', 'click'].forEach(eventType => {
      box.addEventListener(eventType, unlockAudioContext, { passive: true });
      if (canvas) canvas.addEventListener(eventType, unlockAudioContext, { passive: true });
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      statusMsg.innerText = `Reading "${file.name}" (${(file.size / 1024).toFixed(1)} KB)...`;
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        swfArrayBuffer = evt.target.result;
        console.log("✅ SWF Buffer Ready in Memory:", swfArrayBuffer.byteLength, "bytes");

        dropUi.style.display = 'none';
        canvasWrap.style.zIndex = '10';
        box.style.border = 'none';
        btnRestart.style.display = 'inline-block';

        if (canvas) canvas.focus();
        unlockAudioContext();

        try {
          // بنمرر الرابط الافتراضي اللي بينتهي بـ .swf ومضمون 100%
          createWaflash(VIRTUAL_SWF_URL);
        } catch (err) {
          console.error(err);
          statusMsg.innerText = 'Error: ' + err.message;
        }
      };
      
      reader.onerror = function() {
        alert("Failed to read file from storage!");
      };

      reader.readAsArrayBuffer(file);
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        box.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
