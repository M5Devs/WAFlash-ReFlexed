<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAFlash Re:Flexed — Ultimate Player</title>
  
  <!-- أداة فحص الموبايل عشان لو في أي تفصيلة تبان قدامك -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    header { margin-bottom: 12px; text-align: center; }
    h1 { font-size: 1.6rem; color: #38bdf8; }
    h1 span { color: #f97316; }

    .control-panel {
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary { background: #1e293b; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    
    .url-input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      width: 260px;
      font-size: 0.85rem;
    }

    #file-picker { display: none; }

    #waflashContainer {
      position: relative;
      width: 800px;
      max-width: 100%;
      height: 600px;
      max-height: 75vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #waflashStatus {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      color: #38bdf8;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>WAFlash <span>Re:Flexed</span> ⚡</h1>
  </header>

  <div class="control-panel">
    <!-- اختيار ملف محلي أوفلاين من التابلت -->
    <button class="btn" onclick="document.getElementById('file-picker').click()">📂 Select Local SWF</button>
    <input type="file" id="file-picker" accept=".swf, application/x-shockwave-flash, */*">

    <!-- أو إدخال رابط URL مباشر -->
    <input type="text" id="url-box" class="url-input" placeholder="Or enter SWF URL...">
    <button class="btn btn-secondary" onclick="loadUrlFromBox()">Load URL</button>
    <button class="btn btn-secondary" id="btn-fullscreen">⛶</button>
  </div>

  <div id="waflashContainer">
    <canvas class="waflashCanvas" id="canvas" tabindex="1"></canvas>
    <div id="waflashStatus">Ready. Choose a local file or enter URL.</div>
  </div>

  <script>
    // 🧠 السحر البرمجي: اعتراض XHR لخداع C++ وتسليم الملف المحلي بـ Status 200 OK
    let inMemorySwfBuffer = null;
    const VIRTUAL_LOCAL_URL = "https://waflash.local/game.swf";

    const originalXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
      const xhr = new originalXHR();
      let isLocalIntercept = false;

      const origOpen = xhr.open;
      xhr.open = function(method, url) {
        if (url && (url.indexOf("waflash.local") !== -1 || url.indexOf("game.swf") !== -1) && inMemorySwfBuffer) {
          isLocalIntercept = true;
        }
        return origOpen.apply(this, arguments);
      };

      const origSend = xhr.send;
      xhr.send = function() {
        if (isLocalIntercept && inMemorySwfBuffer) {
          setTimeout(() => {
            Object.defineProperty(xhr, 'status', { value: 200, writable: false });
            Object.defineProperty(xhr, 'statusText', { value: 'OK', writable: false });
            Object.defineProperty(xhr, 'readyState', { value: 4, writable: false });
            Object.defineProperty(xhr, 'response', { value: inMemorySwfBuffer, writable: false });
            if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
            if (typeof xhr.onload === 'function') xhr.onload();
          }, 10);
          return;
        }
        return origSend.apply(this, arguments);
      };

      return xhr;
    };
  </script>

  <script type="module" crossorigin="anonymous">
    import { createWaflash } from './wasm/waflash-player.min.js';

    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('waflashStatus');
    const filePicker = document.getElementById('file-picker');
    const urlBox = document.getElementById('url-box');

    // تظبيط التركيز واللمس
    canvas.addEventListener('click', () => canvas.focus());

    // 1. فحص إذا كان في رابط مبعوت في الـ Query Parameter
    const urlParams = new URLSearchParams(window.location.search);
    const swfParam = urlParams.get('swf');

    if (swfParam) {
      urlBox.value = swfParam;
      startEngine(swfParam);
    }

    // 2. تشغيل ملف محلي من التابلت (أوفلاين)
    filePicker.addEventListener('change', (e) => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      statusText.innerText = `Loading "${file.name}" into memory...`;

      const reader = new FileReader();
      reader.onload = function(evt) {
        inMemorySwfBuffer = evt.target.result;
        console.log("✅ Local SWF loaded into Memory:", inMemorySwfBuffer.byteLength, "bytes");
        // بنمرر الرابط الوهمي اللي المتصفح هيرد عليه من الرامات فورا بـ 200 OK
        startEngine(VIRTUAL_LOCAL_URL);
      };
      reader.readAsArrayBuffer(file);
    });

    window.loadUrlFromBox = function() {
      const val = urlBox.value.trim();
      if (val) {
        window.location.search = "?swf=" + encodeURIComponent(val);
      }
    };

    function startEngine(swfUrl) {
      statusText.innerText = "Initializing WAFlash Engine...";
      canvas.focus();
      try {
        createWaflash(swfUrl, window.wafOptions || {});
      } catch (err) {
        console.error(err);
        statusText.innerText = "Error: " + err.message;
      }
    }

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      const container = document.getElementById('waflashContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
