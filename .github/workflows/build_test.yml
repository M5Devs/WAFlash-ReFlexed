name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: waflash_libretro-linux-x64
            binary_path: build/libretro_flash.so
          - os: windows-latest
            artifact_name: waflash_libretro-windows-x64
            binary_path: build/Release/libretro_flash.dll
          - os: macos-latest
            artifact_name: waflash_libretro-macos-x64
            binary_path: build/libretro_flash.dylib

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "build/Release/libretro_flash.dll" ] && [ -f "build/libretro_flash.dll" ]; then
            mkdir -p build/Release
            cp build/libretro_flash.dll build/Release/libretro_flash.dll
          fi

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.binary_path }}
            waflash_libretro.info
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure CMake with Emscripten
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build WebAssembly Targets
        run: cmake --build build-wasm

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waflash-web-wasm
          path: |
            build-wasm/waflash_core.js
            build-wasm/waflash_core.wasm
          if-no-files-found: error

      - name: Stage Web Artifacts
        run: |
          mkdir -p public
          cp index.html public/
          cp build-wasm/waflash_core.js public/
          cp build-wasm/waflash_core.wasm public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
